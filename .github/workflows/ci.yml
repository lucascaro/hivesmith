name: CI

on:
  push:
    branches: [main]
  pull_request:
    # No `labeled` / `unlabeled` here: the label-gated jobs all live in
    # changesets.yml, which carries those trigger types itself. Nothing in
    # this file reads a label, so re-running it on every label edit is pure
    # duplicate work.

# Least privilege by default: no job here needs to write to the repo, and one
# installs an unpinned package from PyPI.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master as of 2026-04-13
        with:
          scandir: '.'
          additional_files: install.sh scripts/brain/append.sh scripts/brain/index.sh scripts/brain/lib.sh scripts/brain/list.sh scripts/brain/read.sh scripts/brain/redact.sh scripts/brain/search.sh scripts/brain/test/run-all.sh scripts/dev-link-local.sh scripts/harvest/correction-episodes-test.sh scripts/harvest/harvest-plans-test.sh scripts/harvest/plan-citations-test.sh scripts/hooks/pre-push scripts/migrate-to-changesets.sh scripts/regen-generated.sh scripts/release.sh scripts/telemetry/attribution-test.sh scripts/telemetry/install-hooks-test.sh scripts/telemetry/install-hooks.sh scripts/telemetry/install-pi.sh scripts/telemetry/log-agent-stop.sh scripts/telemetry/log-agent.sh scripts/telemetry/prepare-commit-msg skills/brain-garden/garden.sh skills/brain-promote/promote.sh skills/feature-ingest/ingest.sh skills/graphify-init/graphify-refresh.sh skills/graphify-init/graphify-setup.sh skills/graphify-init/test/run-all.sh skills/namecheck/namecheck.sh skills/plan-html/start.sh skills/plan-html/stop.sh templates/features/ingest.sh templates/scripts/migrate-to-changesets.sh templates/scripts/regen-generated.sh templates/scripts/release.sh
            install.sh
            scripts/dev-link-local.sh
            scripts/release.sh
            skills/feature-ingest/ingest.sh
            skills/namecheck/namecheck.sh
            templates/features/ingest.sh
            templates/scripts/release.sh
            scripts/brain/lib.sh
            scripts/brain/read.sh
            scripts/brain/append.sh
            scripts/brain/redact.sh
            scripts/brain/index.sh
            scripts/brain/list.sh
            scripts/brain/search.sh
            scripts/brain/test/run-all.sh
            scripts/regen-generated.sh
            scripts/migrate-to-changesets.sh
            skills/brain-promote/promote.sh
            skills/brain-garden/garden.sh
            scripts/hooks/pre-push
            skills/plan-html/start.sh
            skills/plan-html/stop.sh
            templates/scripts/migrate-to-changesets.sh
            templates/scripts/regen-generated.sh
            skills/graphify-init/graphify-setup.sh
            skills/graphify-init/graphify-refresh.sh
            skills/graphify-init/test/run-all.sh
            tests/install-agent-scopes-test.sh


  agent-scopes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run agent scope-resolution suite
        run: bash tests/install-agent-scopes-test.sh

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test — with prefix
        run: |
          HOME="$(mktemp -d)"
          export HOME
          mkdir -p "$HOME/.claude"
          ./install.sh --prefix hs- --no-auto-update --dry-run
      - name: Smoke test — without prefix
        run: |
          HOME="$(mktemp -d)"
          export HOME
          mkdir -p "$HOME/.claude"
          ./install.sh --prefix "" --no-auto-update --dry-run

  render-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install with prefix and verify render
        run: |
          HOME="$(mktemp -d)"
          export HOME
          mkdir -p "$HOME/.claude"
          HIVESMITH_DIR="$(pwd)"
          ./install.sh --prefix hs- --no-auto-update
          grep -q '/hs-feature-plan' "$HIVESMITH_DIR/.rendered/hs-/skills/hs-feature-research/SKILL.md"
          if grep -q '/feature-plan\b' "$HIVESMITH_DIR/.rendered/hs-/skills/hs-feature-research/SKILL.md"; then exit 1; fi
          grep -q 'scripts/release.sh' "$HIVESMITH_DIR/.rendered/hs-/skills/hs-release/SKILL.md"

  subagent-linking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Subagents link, stay idempotent, and never clobber user files
        run: |
          HOME="$(mktemp -d)"
          export HOME
          mkdir -p "$HOME/.claude"
          REPO="$(pwd)"

          ./install.sh --no-auto-upgrade
          test -L "$HOME/.claude/agents/hs-reviewer.md"
          test -L "$HOME/.claude/agents/hs-validator.md"

          # Idempotence: a second run creates nothing new.
          ./install.sh --no-auto-upgrade | grep -E '^Linked: 0 new'

          # A user-owned symlink at a name we ship must survive untouched.
          rm "$HOME/.claude/agents/hs-reviewer.md"
          echo mine > "$HOME/mine.md"
          ln -s "$HOME/mine.md" "$HOME/.claude/agents/hs-reviewer.md"
          ./install.sh --no-auto-upgrade | grep -q 'WARN.*hs-reviewer.md'
          test "$(readlink "$HOME/.claude/agents/hs-reviewer.md")" = "$HOME/mine.md"
          rm "$HOME/.claude/agents/hs-reviewer.md"

          # `disable` opts a single subagent out without touching the others.
          printf 'disable = ["hs-reviewer"]\n' > "$HOME/.hivesmith.toml"
          ./install.sh --no-auto-upgrade
          test ! -L "$HOME/.claude/agents/hs-reviewer.md"
          test -L "$HOME/.claude/agents/hs-validator.md"
          rm "$HOME/.hivesmith.toml"
          ./install.sh --no-auto-upgrade
          test -L "$HOME/.claude/agents/hs-reviewer.md"

          # A hivesmith link with no matching agent file is swept.
          ln -s "$REPO/agents/hs-gone.md" "$HOME/.claude/agents/hs-gone.md"
          ./install.sh --no-auto-upgrade
          test ! -L "$HOME/.claude/agents/hs-gone.md"

          # Uninstall clears our links, including one we no longer enumerate.
          ln -s "$REPO/agents/hs-orphan.md" "$HOME/.claude/agents/hs-orphan.md"
          ./install.sh --uninstall
          test -z "$(ls -A "$HOME/.claude/agents/" 2>/dev/null)"

  brain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run brain test suite
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          bash scripts/brain/test/run-all.sh

  graphify-init-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install graphify
        run: |
          pipx install graphifyy || python3 -m pip install --user graphifyy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify graphify is callable
        run: graphify --version
      - name: Run graphify-init test suite
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          # GRAPHIFY_REQUIRED=1: a missing graphify must fail the job, not
          # quietly skip the guard-patch regression this suite exists to catch.
          GRAPHIFY_REQUIRED=1 bash skills/graphify-init/test/run-all.sh

  # Informational — macOS smoke. Not used as a branch-protection context.
  install-smoke-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test — macOS
        run: |
          HOME="$(mktemp -d)"
          export HOME
          mkdir -p "$HOME/.claude"
          ./install.sh --prefix hs- --no-auto-update --dry-run
