# Changeset / generated-file enforcement.
#
# Scaffolded by `hivesmith-init`. Provides three jobs that work with
# `scripts/regen-generated.sh` to keep `CHANGELOG.md` /
# `docs/product-specs/index.md` / `docs/exec-plans/tech-debt-tracker.md`
# out of the PR-conflict surface:
#
#   1. block-generated-edits — hard-fails any PR diff touching a generated
#      file. Bypass: apply the `regen-override` label.
#   2. verify-generated     — runs the regenerator against the PR merge ref
#      to catch interaction bugs; requires at least one new
#      `.changesets/*.md` (unless labelled `no-changeset`).
#   3. regenerate-generated — on push to main, regenerates aggregates and
#      opens (or updates) a PR with the result, then enables auto-merge.
#      A PR rather than a direct push because a protected `main` rejects
#      bot pushes: "Changes must be made through a pull request."
#
# Merge this workflow into your existing CI file or keep it standalone.
name: changesets

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` / `unlabeled` are included so adding/removing the bypass
    # labels after a PR opens re-runs the gate jobs.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

jobs:
  block-generated-edits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fail if PR edits generated files
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          GENERATED=(
            CHANGELOG.md
            docs/product-specs/index.md
            docs/exec-plans/tech-debt-tracker.md
          )
          touched=$(git diff --name-only "$BASE"..."$HEAD" -- "${GENERATED[@]}")
          if [ -n "$touched" ]; then
            if printf '%s' "$PR_LABELS" | jq -e '.[] | select(.name == "regen-override")' >/dev/null 2>&1; then
              echo "OK: regen-override label present — bypassing check."
              echo "Touched:"
              echo "$touched"
              exit 0
            fi
            echo "::error::PR edits generated files directly:"
            echo "$touched"
            echo "These files are regenerated on main from .changesets/, spec frontmatter, and .tech-debt/."
            echo "Edit the source files instead, or apply the 'regen-override' label if this is intentional."
            exit 1
          fi
          echo "OK: no generated files were touched."

  verify-generated:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}
      - name: Regenerate against the merge ref
        # NOT `--check` — that would fail any PR that adds a source file
        # because the committed generated copies legitimately lag.
        run: scripts/regen-generated.sh
      - name: Require a changeset unless labelled no-changeset
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if printf '%s' "$PR_LABELS" | jq -e '.[] | select(.name == "no-changeset")' >/dev/null 2>&1; then
            echo "OK: no-changeset label present — skipping requirement."
            exit 0
          fi
          if git diff --name-only "$BASE"..."$HEAD" -- ':(glob).changesets/*.md' | grep -vE '^\.changesets/(README\.md|\.gitkeep)$' | grep -q .; then
            echo "OK: PR adds at least one changeset."
            exit 0
          fi
          echo "::error::PR has no .changesets/*.md entry."
          echo "Add a per-PR changeset (see .changesets/README.md for the schema),"
          echo "or apply the 'no-changeset' label if this is a docs/CI-only change."
          exit 1

  regenerate-generated:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.REGEN_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Regenerate aggregates
        run: scripts/regen-generated.sh
      - name: Open or update the regen PR
        env:
          GH_TOKEN: ${{ secrets.REGEN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          GENERATED=(
            CHANGELOG.md
            docs/product-specs/index.md
            docs/exec-plans/tech-debt-tracker.md
          )
          if [ -z "$(git status --porcelain "${GENERATED[@]}")" ]; then
            echo "no changes to commit"
            exit 0
          fi

          BRANCH=chore/regen-aggregates
          git config user.name  "hivesmith-bot"
          git config user.email "hivesmith-bot@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "${GENERATED[@]}"
          git commit -m "chore: regenerate aggregates"
          # Force-push: the branch is a scratch surface, always rebuilt from
          # the current main. If a regen PR is already open, this updates it
          # in place rather than opening a second one.
          git push -f origin "$BRANCH"

          if [ "$(gh pr list --head "$BRANCH" --state open --json number -q 'length')" -gt 0 ]; then
            echo "Regen PR already open — force-push updated it."
          else
            # printf, not a multi-line shell string: continuation lines
            # inside this `run: |` block carry the block's indentation, and
            # 10 leading spaces would render the body as a code block.
            printf '%s\n\n%s\n' \
              'Automated. Regenerates `CHANGELOG.md`, `docs/product-specs/index.md`, and `docs/exec-plans/tech-debt-tracker.md` from their sources (`.changesets/`, spec frontmatter, `.tech-debt/`).' \
              'Opened as a PR rather than direct-pushed because `main` requires changes to go through one. Merging this re-triggers the job; the second run finds nothing to regenerate and exits.' \
              > /tmp/regen-pr-body.md
            gh pr create --base main --head "$BRANCH" \
              --title "chore: regenerate aggregates" \
              --body-file /tmp/regen-pr-body.md \
              --label regen-override --label no-changeset
          fi

          # Land it without a human in the loop where possible. With the
          # default GITHUB_TOKEN the PR's checks open in an approval-required
          # state, so auto-merge parks until someone clicks "Approve and run"
          # — set a REGEN_TOKEN secret (a non-admin PAT with contents +
          # pull-requests write) to make the whole path unattended.
          gh pr merge "$BRANCH" --squash --auto --delete-branch \
            || echo "::warning::Could not enable auto-merge — merge the regen PR manually."
