version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # `labels:` replaces dependabot's defaults, so the two it would have
    # applied on its own are listed explicitly. `no-changeset` pre-satisfies
    # the changesets.yml gate: action bumps are CI-only and never
    # user-visible. A future ecosystem (npm, etc.) gets its own `updates:`
    # entry and must decide for itself whether it earns the bypass.
    labels: [dependencies, github_actions, no-changeset]
